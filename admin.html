<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeedJp - Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f9; padding: 20px; }
        .admin-container { max-width: 600px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { background: #d2a679; color: white; border: none; padding: 12px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #b88a5d; }
        #adminContent { display: none; }

        .product-list-section { margin-top: 35px; border-top: 2px solid #eee; padding-top: 20px; }
        .product-item { display: flex; align-items: center; justify-content: space-between; background: #fafafa; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; gap: 10px; }
        .product-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .product-info { flex-grow: 1; text-align: left; }
        .product-info h4 { font-size: 14px; color: #333; margin-bottom: 3px; }
        .product-info span { font-size: 13px; font-weight: bold; color: #d2a679; }
        .btn-delete { background: #ff3b30; color: white; border: none; padding: 8px 12px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; width: auto; }
        .btn-delete:hover { background: #d32f2f; }
    </style>
    <!-- Firebase Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="admin-container">
    <!-- পাসওয়ার্ড সেকশন -->
    <div id="loginSection">
        <h2>NeedJp অ্যাডমিন লগইন</h2>
        <div class="form-group">
            <label>পাসওয়ার্ড প্রবেশ করান:</label>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড লিখুন">
        </div>
        <button onclick="checkPassword()">লগইন</button>
    </div>

    <!-- প্রোডাক্ট আপলোড ও ম্যানেজ সেকশন -->
    <div id="adminContent">
        <h2>নতুন প্রোডাক্ট আপলোড</h2>
        <form id="productForm">
            <div class="form-group">
                <label>প্রোডাক্টের নাম *</label>
                <input type="text" id="pTitle" required placeholder="যেমন: ইমপোর্টেড লেডিস ব্যাগ">
            </div>
            <div class="form-group">
                <label>মূল্য (টাকা) *</label>
                <input type="number" id="pPrice" required placeholder="যেমন: 1250">
            </div>
            <div class="form-group">
                <label>বিবরণ (Details) *</label>
                <textarea id="pDesc" rows="3" required placeholder="• মেটেরিয়াল: লেদার..."></textarea>
            </div>
            <div class="form-group">
                <label>প্রোডাক্টের ছবি সিলেক্ট করুন *</label>
                <input type="file" id="pImgFile" accept="image/*" required>
            </div>
            <button type="button" onclick="uploadProduct()" id="uploadBtn">আপলোড করুন</button>
        </form>

        <div class="product-list-section">
            <h3 style="margin-bottom: 15px; font-size: 16px; text-align: center; color: #444;">আপলোডকৃত প্রোডাক্টসমূহ</h3>
            <div id="adminProductList">
                <p style="text-align: center; color: #777;">লোড হচ্ছে...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAyvwU9znCjByCZ_UZveWo8m-9EDvDiHJk",
      authDomain: "needjp-store.firebaseapp.com",
      projectId: "needjp-store",
      storageBucket: "needjp-store.firebasestorage.app",
      messagingSenderId: "1876371529444",
      appId: "1:1876371529444:web:9ab84f1af05e79b04756f1",
      measurementId: "G-DJY5MQCEGP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const ADMIN_PASSWORD = "12345"; 

    function checkPassword() {
        const pass = document.getElementById('adminPass').value;
        if(pass === ADMIN_PASSWORD) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadAdminProducts();
        } else {
            alert('ভুল পাসওয়ার্ড!');
        }
    }

    // ছবিকে সরাসরি কোডে রূপান্তরিত করার ফাংশন (Base64)
    function convertToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function uploadProduct() {
        const title = document.getElementById('pTitle').value;
        const price = document.getElementById('pPrice').value;
        const desc = document.getElementById('pDesc').value;
        const fileInput = document.getElementById('pImgFile');
        const btn = document.getElementById('uploadBtn');

        if(!title || !price || !desc || !fileInput.files[0]) {
            alert('অনুগ্রহ করে সকল তথ্য পূরণ করুন!');
            return;
        }

        btn.disabled = true;
        btn.innerText = "ছবি প্রসেস হচ্ছে...";

        try {
            const file = fileInput.files[0];
            
            // ছবি রিসাইজ ও বেস-৬৪ কনভার্ট
            const imageUrl = await convertToBase64(file);

            btn.innerText = "ডাটা সেভ হচ্ছে...";

            await db.collection('products').add({
                title: title,
                price: Number(price),
                description: desc,
                image: imageUrl,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert('প্রোডাক্ট সফলভাবে আপলোড হয়েছে!');
            document.getElementById('productForm').reset();
        } catch (error) {
            alert('ত্রুটি: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "আপলোড করুন";
        }
    }

    function loadAdminProducts() {
        const listDiv = document.getElementById('adminProductList');
        
        db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            listDiv.innerHTML = '';
            
            if (snapshot.empty) {
                listDiv.innerHTML = '<p style="text-align: center; color: #777;">কোনো প্রোডাক্ট আপলোড করা নেই।</p>';
                return;
            }

            snapshot.forEach(doc => {
                const p = doc.data();
                const id = doc.id;

                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <img src="${p.image}" alt="${p.title}">
                    <div class="product-info">
                        <h4>${p.title}</h4>
                        <span>৳${p.price}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteProduct('${id}', '${p.title.replace(/'/g, "\\'")}')">ডিলিট করুন</button>
                `;
                listDiv.appendChild(item);
            });
        });
    }

    async function deleteProduct(id, title) {
        if (confirm(`আপনি কি নিশ্চিত যে "${title}" প্রোডাক্টটি ডিলিট করতে চান?`)) {
            try {
                await db.collection('products').doc(id).delete();
                alert('প্রোডাক্টটি সফলভাবে ডিলিট করা হয়েছে!');
            } catch (error) {
                alert('ডিলিট করতে সমস্যা হয়েছে: ' + error.message);
            }
        }
    }
</script>
</body>
</html>
