<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEED JP - Online Shop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; padding-bottom: 60px; }
        header { background: #232f3e; color: white; padding: 15px; text-align: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 10px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .product-card h3 { font-size: 18px; margin: 10px 0; }
        .price { color: #e47911; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        button { background: #ffd814; border: 1px solid #fcd200; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #f7ca00; }
        
        /* Modal Style */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
        .modal-content input, .modal-content select { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        .close-btn { background: #cc0000; color: white; border: none; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>NEED JP</h1>
        <p>আপনার নির্ভরযোগ্য অনলাইন শপ</p>
    </header>

    <div class="container">
        <h2>প্রোডাক্ট তালিকা</h2>
        <br>
        <div class="products" id="product-list">
            <!-- Sample Product 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>ডেমো প্রোডাক্ট ১</h3>
                <div class="price">৳ ৫০০</div>
                <button onclick="openCheckout('ডেমো প্রোডাক্ট ১', 500)">এখনই কিনুন</button>
            </div>
            <!-- Sample Product 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>ডেমো প্রোডাক্ট ২</h3>
                <div class="price">৳ ১০০০</div>
                <button onclick="openCheckout('ডেমো প্রোডাক্ট ২', 1000)">এখনই কিনুন</button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h3>অর্ডার কনফার্ম করুন</h3>
            <p id="modal-product-info"></p>
            
            <input type="text" id="custName" placeholder="আপনার নাম" required>
            <input type="text" id="custPhone" placeholder="মোবাইল নম্বর" required>
            <input type="text" id="custAddress" placeholder="পূর্ণাঙ্গ ঠিকানা" required>
            
            <label for="paymentMethod"><b>পেমেন্ট মেথড সিলেক্ট করুন:</b></label>
            <select id="paymentMethod" onchange="togglePaymentDetails()">
                <option value="Cash on Delivery">ক্যাশ অন ডেলিভারি (COD)</option>
                <option value="bKash">bKash (01732274010)</option>
                <option value="Nagad">Nagad (01747425457)</option>
            </select>

            <div id="paymentInstructions" style="display:none; font-size: 13px; color: #333; margin: 5px 0;">
                <p id="payText"></p>
                <input type="text" id="trxId" placeholder="TrxID (ট্রানজেকশন আইডি)">
            </div>

            <button onclick="sendOrder()" style="background: #25D366; color: white; border: none; margin-top: 10px;">WhatsApp-এ অর্ডার পাঠান</button>
            <button class="close-btn" onclick="closeModal()">বন্ধ করুন</button>
        </div>
    </div>

    <script>
        let selectedProduct = '';
        let selectedPrice = 0;

        function openCheckout(name, price) {
            selectedProduct = name;
            selectedPrice = price;
            document.getElementById('modal-product-info').innerText = `প্রোডাক্ট: ${name} - মূল্য: ৳${price}`;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function togglePaymentDetails() {
            let method = document.getElementById('paymentMethod').value;
            let payDiv = document.getElementById('paymentInstructions');
            let payText = document.getElementById('payText');

            if (method === 'bKash') {
                payDiv.style.display = 'block';
                payText.innerHTML = "bKash (Personal) <b>01732274010</b> নম্বরে Send Money করুন এবং TrxID নিচে লিখুন।";
            } else if (method === 'Nagad') {
                payDiv.style.display = 'block';
                payText.innerHTML = "Nagad (Personal) <b>01747425457</b> নম্বরে Send Money করুন এবং TrxID নিচে লিখুন।";
            } else {
                payDiv.style.display = 'none';
            }
        }

        function sendOrder() {
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let address = document.getElementById('custAddress').value;
            let method = document.getElementById('paymentMethod').value;
            let trxId = document.getElementById('trxId').value;

            if(!name || !phone || !address) {
                alert('অনুগ্রহ করে নাম, ফোন নম্বর ও ঠিকানা পূরণ করুন।');
                return;
            }

            let message = `*নতুন অর্ডার - NEED JP*%0A%0A` +
                          `*প্রোডাক্ট:* ${selectedProduct}%0A` +
                          `*মূল্য:* ৳${selectedPrice}%0A%0A` +
                          `*গ্রাহকের তথ্য:*%0A` +
                          `নাম: ${name}%0A` +
                          `ফোন: ${phone}%0A` +
                          `ঠিকানা: ${address}%0A%0A` +
                          `*পেমেন্ট মাধ্যম:* ${method}%0A`;

            if(method !== 'Cash on Delivery') {
                message += `*TrxID:* ${trxId}%0A`;
            }

            let whatsappURL = `https://wa.me/8801732274010?text=${message}`;
            window.open(whatsappURL, '_blank');
        }
    </script>
</body>
</html>
